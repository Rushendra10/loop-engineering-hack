# Akash SDL for fixloop. Deploy via console.akash.network (fastest at a
# hackathon) or `akash tx deployment create deploy.yaml`.
# Sanity-check current SDL syntax with the Akash booth -- they will also
# have testnet/credits vouchers for hackathon teams. Ask.
version: "2.0"

services:
  fixloop:
    image: ghcr.io/rushendra10/fixloop:hackathon-20260717-node-demo-v2
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
    env:
      # Add short-lived credentials in an uncommitted SDL only when the
      # service integration needs them. Akash env values are visible to the
      # selected provider.
      - VERIFIER_MODE=local
      - FIXLOOP_CURSOR_MODEL=auto
      - FIXLOOP_PRICE_USDC=0.25

profiles:
  compute:
    fixloop:
      resources:
        cpu:
          units: 1
        memory:
          size: 2Gi
        storage:
          size: 5Gi
  placement:
    dcloud:
      pricing:
        fixloop:
          denom: uact
          amount: 10000

deployment:
  fixloop:
    dcloud:
      profile: fixloop
      count: 1
